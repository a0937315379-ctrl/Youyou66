<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>問卷回覆管理</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header class="hero"><div class="eyebrow">PRIVATE RESPONSE DASHBOARD</div><h1>回覆紀錄</h1><p>只有被授權的管理帳號可以讀取資料。</p></header><section class="card" id="login-panel"><h2>管理者登入</h2><form id="login-form"><label for="email">電子郵件</label><input id="email" type="email" required autocomplete="username"><label for="password">密碼</label><input id="password" type="password" required autocomplete="current-password"><button type="submit">登入查看</button></form><p id="login-status" class="status" role="status"></p></section><section id="dashboard" class="hidden"><div class="topbar"><h2>已收到的回覆 <span id="count" class="pill">0</span></h2><button id="logout">登出</button></div><p class="muted">依提交時間由新到舊排列；這些回覆是作答當下的心情，不應被當成心理診斷。</p><div id="records"></div></section></main><script type="module" src="admin.js"></script></body></html>
